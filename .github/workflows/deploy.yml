name: Deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: make4yu-pitching
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.151.2

      - name: Create the Pages project (first run only)
        run: npx wrangler pages project create "$PROJECT" --production-branch=main || echo "Project already exists"

      # Private settings live only in GitHub secrets and Cloudflare, never in the repo.
      - name: Sync private settings to Cloudflare
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler pages secret put "$1" --project-name="$PROJECT" > /dev/null && echo "Set $1"; else echo "Skipped $1 (secret not set)"; fi; }
          put GOOGLE_SERVICE_ACCOUNT_JSON "$SA_JSON"
          put SHEET_ID "$SHEET_ID"
          put ACCESS_TEAM_DOMAIN "$ACCESS_TEAM_DOMAIN"
          put ACCESS_AUD "$ACCESS_AUD"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true
